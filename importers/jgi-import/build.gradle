// JGI-specific import tooling (TASK-060). This module is deliberately
// excisable: the application never depends on it, and a shared/public
// snapshot of the repository drops this directory plus its
// settings.gradle include (see docs/sharing.md). Its integration tests
// boot the application context, so the dependency points only from here
// to the app — never the reverse.
plugins {
    id 'java'
    id 'groovy'
    id 'application'
}

// The production import trigger (TASK-066):
//   ./gradlew :importers:jgi-import:run --args='--jgi-import.mode=import ...'
application {
    mainClass = 'org.jadetipi.jadetipi.importer.JgiImportCliApplication'
}

apply from: "${rootProject.projectDir}/gradle/scripts/repository.gradle"
apply from: "${rootProject.projectDir}/gradle/scripts/integration-test.gradle"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

ext {
    spockVersion = '2.4-M6-groovy-4.0'
}

dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:3.5.6')

    implementation 'org.apache.groovy:groovy'
    implementation 'org.apache.groovy:groovy-json'
    implementation 'org.springframework:spring-context'
    implementation 'org.springframework:spring-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb-reactive'
    implementation 'io.projectreactor:reactor-core'
    implementation 'org.slf4j:slf4j-api'
    // The production import trigger (TASK-066): the drive loop publishes dto
    // Messages to the transaction topic. Library dependencies only — the
    // application still never depends on this module.
    implementation project(':libraries:jade-tipi-dto')
    implementation 'org.apache.kafka:kafka-clients'
    implementation libs.uuid.creator
    // WebClient connector for the standalone CLI context (the app supplies
    // its own when this module rides the integration-test classpath)
    runtimeOnly 'io.projectreactor.netty:reactor-netty-http'

    testImplementation platform('org.springframework.boot:spring-boot-dependencies:3.5.6')
    testImplementation 'com.fasterxml.jackson.core:jackson-databind'
    testImplementation group: 'org.spockframework', name: 'spock-core', version: spockVersion
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // class mocking for Spock (the app module inherits these via spring-boot-starter-test)
    testRuntimeOnly 'net.bytebuddy:byte-buddy'
    testRuntimeOnly 'org.objenesis:objenesis:3.4'

    testImplementation project(':jade-tipi')

    // integration tests boot the full application context (app → module never)
    integrationTestImplementation project(':jade-tipi')
    integrationTestImplementation project(':libraries:jade-tipi-dto')
    integrationTestImplementation 'org.springframework.boot:spring-boot-starter-test'
    integrationTestImplementation group: 'org.spockframework', name: 'spock-spring', version: spockVersion
    integrationTestImplementation 'org.springframework.kafka:spring-kafka'
    integrationTestImplementation 'org.apache.kafka:kafka-clients'
    integrationTestImplementation libs.uuid.creator
}

tasks.named('test') {
    useJUnitPlatform()
}
