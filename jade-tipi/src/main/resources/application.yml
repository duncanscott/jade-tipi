spring:
  application:
    name: jadetipi
    version: ${version}
  # HTTP JSON bodies are snake_case (TASK-055, director ruling): API
  # responses carry the same field conventions as wire messages and
  # stored root documents. Map payloads pass through verbatim.
  jackson:
    property-naming-strategy: SNAKE_CASE
  profiles:
    active: mongodb
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8484/realms/jade-tipi
  kafka:
    bootstrap-servers: \${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: \${KAFKA_CONSUMER_GROUP:jadetipi-txn-ingest}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
    listener:
      ack-mode: MANUAL_IMMEDIATE

jadetipi:
  kafka:
    txn-topic-pattern: \${KAFKA_TXN_TOPIC_PATTERN:jdtp-txn-.*|jdtp_cli_kli}
    enabled: \${KAFKA_INGEST_ENABLED:true}
    persist-timeout-seconds: \${KAFKA_PERSIST_TIMEOUT_SECONDS:30}
  # This Jade-Tipi instance's owning org/grp, used for locally synthesized
  # world-unique IDs such as the genesis bootstrap usr (TASK-039).
  instance:
    org: \${JADETIPI_INSTANCE_ORG:jade-tipi-org}
    grp: \${JADETIPI_INSTANCE_GRP:dev}
  # Startup ensure for the reserved bootstrap usr root (usr~jdtp-admin).
  genesis:
    enabled: \${JADETIPI_GENESIS_ENABLED:true}
  # Background materialization worker (TASK-052): the commit path only marks
  # the header and nudges; this worker projects committed transactions and
  # stamps materialized_at, with a periodic sweep as the guarantee (UT-7).
  materialization:
    enabled: \${JADETIPI_MATERIALIZATION_ENABLED:true}
    sweep-interval: \${JADETIPI_MATERIALIZATION_SWEEP_INTERVAL:PT30S}
  # Narrow local CouchDB-to-JDTP import loop (TASK-043). Defaults target
  # the docker-compose CouchDB with its loopback-only dev credentials.
  import:
    couchdb:
      url: \${JADETIPI_IMPORT_COUCHDB_URL:http://localhost:5984}
      username: \${JADETIPI_IMPORT_COUCHDB_USERNAME:admin}
      password: \${JADETIPI_IMPORT_COUCHDB_PASSWORD:admin}

server:
  port: ${backendPort}
base-package: org.jadetipi
docs:
  url: https://github.com/duncanscott/jade-tipi

# CORS and actuator configuration
management:
  info:
    build:
      enabled: true
  endpoints:
    web:
      exposure:
        include: '*'
      cors:
        allowed-origins: "http://localhost:3000,http://192.168.1.231:3000"
        allowed-methods: "*"
        allowed-headers: "*"
  endpoint:
    health:
      show-details: always
